name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # allow manual trigger from GitHub UI

env:
  PROJECT_ID: fx-range-master
  SERVICE:    fx-range-master
  REGION:     me-west1

jobs:
  # ── 1. Lint / quick sanity ─────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Syntax-check Python files
        run: |
          python -m py_compile app.py analyzer.py engine.py live_signals.py \
            ml_filter.py ml_retrain.py news_monitor.py scanner.py events.py \
            macro_data.py data_export.py auth.py \
            candlestick_patterns.py adaptive_stops.py drift_monitor.py \
            circuit_breaker.py chart_analysis.py
          echo "All Python files OK"

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/fx/package-lock.json

      - name: Install fx app deps
        working-directory: apps/fx
        run: npm ci

      - name: TypeScript check (fx)
        working-directory: apps/fx
        run: npx tsc --noEmit

  # ── 2. Smoke test — verifies the app actually loads its modules ────────────
  # This catches ImportError / missing-symbol bugs that compile cleanly but
  # would 503 in production (see v1.8.0 / v1.8.1 incident: get_firestore dropped
  # from auth.py while still imported by app.py).
  smoke:
    name: Smoke (import check)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Create dummy Firebase service account (bypass mode)
        run: echo "{}" > firebase-service-account.json

      - name: Import all top-level modules
        run: |
          python -c "
          import app, auth, ml_filter, scanner, news_monitor, events
          print('All modules imported successfully')
          "

      - name: Verify Flask app object exposes expected routes
        run: |
          python -c "
          from app import app
          routes = sorted(str(r.rule) for r in app.url_map.iter_rules())
          required = ['/', '/login', '/admin', '/api/data']
          missing = [r for r in required if r not in routes]
          assert not missing, f'Missing routes: {missing}'
          print(f'Found {len(routes)} routes, all required present')
          "

  # ── 3. Build React frontend (apps/fx) ─────────────────────────────────────
  build-frontend:
    name: Build React frontend
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/fx/package-lock.json

      - name: Install fx app deps
        working-directory: apps/fx
        run: npm ci

      - name: Build
        working-directory: apps/fx
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: apps/fx/dist/
          retention-days: 1

  # ── 4. Deploy to Cloud Run ─────────────────────────────────────────────────
  # Only runs on push to main (NOT on pull_request), so PRs run all checks
  # without ever hitting production.
  deploy:
    name: Deploy → Cloud Run
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      # Download pre-built React dist into apps/fx/dist/
      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: apps/fx/dist/

      # Write Firebase service-account JSON from secret
      - name: Write Firebase service account
        run: echo '${{ secrets.FIREBASE_SA_JSON }}' > firebase-service-account.json

      # Authenticate to GCP
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Deploy — Cloud Build compiles & pushes the container, then updates Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --source . \
            --region  $REGION \
            --project $PROJECT_ID \
            --allow-unauthenticated \
            --quiet

      - name: Print service URL
        run: |
          URL=$(gcloud run services describe $SERVICE \
            --region $REGION --project $PROJECT_ID \
            --format "value(status.url)")
          echo "### Deployed to $URL" >> $GITHUB_STEP_SUMMARY
          echo "Live URL: $URL"
