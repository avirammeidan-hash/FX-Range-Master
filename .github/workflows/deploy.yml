name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:          # allow manual trigger from GitHub UI

env:
  PROJECT_ID: fx-range-master
  SERVICE:    fx-range-master
  REGION:     me-west1

jobs:
  # ── 1. Lint / quick sanity ─────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Syntax-check Python files
        run: |
          python -m py_compile app.py analyzer.py engine.py live_signals.py \
            ml_filter.py ml_retrain.py news_monitor.py scanner.py events.py \
            macro_data.py data_export.py auth.py
          echo "All Python files OK"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  # ── 2. Build React frontend ────────────────────────────────────────────────
  build-frontend:
    name: Build React frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 3. Deploy to Cloud Run ─────────────────────────────────────────────────
  deploy:
    name: Deploy → Cloud Run
    runs-on: ubuntu-latest
    needs: build-frontend

    permissions:
      contents: read
      id-token: write     # needed for Workload Identity Federation (optional)

    steps:
      - uses: actions/checkout@v4

      # Download pre-built React dist
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      # Write Firebase service-account JSON from secret
      - name: Write Firebase service account
        run: echo '${{ secrets.FIREBASE_SA_JSON }}' > firebase-service-account.json

      # Authenticate to GCP using a service-account key stored as a secret
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Deploy — Cloud Build compiles & pushes the container, then updates Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --source . \
            --region  $REGION \
            --project $PROJECT_ID \
            --allow-unauthenticated \
            --quiet

      - name: Print service URL
        run: |
          URL=$(gcloud run services describe $SERVICE \
            --region $REGION --project $PROJECT_ID \
            --format "value(status.url)")
          echo "### Deployed to $URL" >> $GITHUB_STEP_SUMMARY
          echo "Live URL: $URL"
